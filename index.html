<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Official Station Handy Daily Time Record</title>
        <link rel="manifest" href="manifest.json" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="icon" href="favicon.ico" type="image/x-icon">
        <!-- For modern browsers -->
        <link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="img/icons/favicon-16x16.png">
        <meta name="theme-color" content="#3498db" />
        <!-- Add Font Awesome for icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    </head>
    <body>
        <header>
            <div class="header-content">
                <h1>WPU OSH-DTR</h1>
                
                <!-- Logo div removed -->
                
                <div class="auth-section">
                    <!-- Login button (visible when logged out) -->
                    <button id="login-btn" class="auth-btn">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Sign in</span>
                    </button>
                    
                    <!-- User info panel (visible when logged in) -->
                    <div id="user-panel" class="hidden">
                        <div class="user-info">
                            <div class="user-avatar">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <span id="user-email"></span>
                            <button id="logout-btn">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <div id="scanner-container">
              <video id="scanner-preview"></video>
              <canvas id="captured-image" style="display: none;"></canvas>
              <div id="scanner-placeholder">
                <div id="scanner-target">
                  <span></span>
                </div>
                <div id="scanner-instructions">Scan QR Code Here</div>
              </div>
            </div>

            <div id="employee-info" class="hidden">
                <table>
                    <tr>
                        <th>Last Name</th>
                        <td id="employee-lastname"></td>
                    </tr>
                    <tr>
                        <th>First Name</th>
                        <td id="employee-firstname"></td>
                    </tr>
                </table>

                <div id="action-container">
                    <h3>Select Action:</h3>
                    <div class="action-options">
                        <label>
                            <input
                                type="radio"
                                name="action"
                                value="Time In"
                                checked
                            />
                            Time In
                        </label>
                        <label>
                            <input
                                type="radio"
                                name="action"
                                value="Lunch Out"
                            />
                            Lunch Out
                        </label>
                        <label>
                            <input
                                type="radio"
                                name="action"
                                value="Lunch In"
                            />
                            Lunch In
                        </label>
                        <label>
                            <input
                                type="radio"
                                name="action"
                                value="Time Out"
                            />
                            Time Out
                        </label>
                        <label>
                            <input
                                type="radio"
                                name="action"
                                value="University Activity"
                            />
                            University Activity
                        </label>
                    </div>
                    <button id="submit-btn">Submit</button>
                    <button id="scan-again-btn">Scan Again</button>
                </div>
            </div>

            <div id="status-container">
                <div id="status-message"></div>
                <div id="network-status">Online</div>
                <div id="pending-syncs" class="hidden">
                    <span id="pending-count">0</span> record/s pending sync
                </div>
            </div>
        </main>

        <!-- Login Modal -->
        <div id="login-modal" class="modal hidden">
            <div class="modal-content">
                <button class="close-modal">&times;</button>
                <div class="modal-header">
                    <i class="fas fa-id-card modal-icon"></i>
                    <h2>WPU Authentication</h2>
                </div>
                <p>Please sign in with your WPU Google account to submit attendance records.</p>
                <button id="google-signin-btn" class="google-btn">
                    <i class="fab fa-google"></i>
                    <span>Sign in with Google</span>
                </button>
                <div id="login-error" class="hidden"></div>
            </div>
        </div>

        <!-- Firebase SDKs -->
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
        
        <!-- Application scripts -->
        <script src="js/zxing.min.js"></script>
        <script src="js/firebase-config.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/db.js"></script>
        <script src="js/sheets-api.js"></script>
        <script src="js/qr-scanner.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
